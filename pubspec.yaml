name: green_screen_shot
description: Green Screen Shot - camera and live chroma-key studio.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2+1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  gallery_saver_plus: ^3.2.9
  flutter_shaders: ^0.1.3
  image_picker: ^1.1.2
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/chroma_key.frag
